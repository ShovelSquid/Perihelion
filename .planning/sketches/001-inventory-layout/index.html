<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 001: Inventory Layout</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    padding-top: 40px;
    overflow: hidden;
  }

  /* ---------- variant tabs ---------- */
  #variant-nav {
    position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 9998;
    display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-8);
    background: #0a0b0c; border-bottom: 1px solid var(--color-border);
    font-family: var(--font-sans);
  }
  .variant-tab {
    background: transparent; color: var(--color-text-muted); border: 1px solid transparent;
    padding: 5px 10px; border-radius: var(--radius-md); cursor: pointer; font: inherit; font-size: var(--text-sm);
    transition: all 0.15s ease;
  }
  .variant-tab:hover { color: var(--color-text); border-color: var(--color-border); }
  .variant-tab.active { color: var(--color-bg); background: var(--color-primary); }
  .variant-tab { white-space: nowrap; flex: none; }
  #variant-nav .hint { margin-left: auto; color: var(--color-text-muted); font-size: var(--text-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  kbd {
    font-family: var(--font-mono); font-size: var(--text-xs); padding: 1px 5px;
    border: 1px solid var(--color-border-strong); border-bottom-width: 2px; border-radius: var(--radius-sm);
    color: var(--color-text);
  }

  /* ---------- fake live game view ---------- */
  #game { position: relative; height: calc(100vh - 40px); overflow: hidden;
    background:
      linear-gradient(180deg, #2a3239 0%, #1b2126 55%, #161a1d 56%, #111416 100%);
  }
  .horizon-grid { position: absolute; inset: 56% 0 0 0;
    background-image: linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
                      linear-gradient(0deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px; }
  .enemy { position: absolute; width: 14px; height: 30px; background: var(--color-danger); border-radius: 3px 3px 0 0; opacity: 0.85; }
  .enemy::before { content: ''; position: absolute; top: -10px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--color-danger); }
  .e1 { top: 48%; animation: patrol 7s ease-in-out infinite alternate; }
  .e2 { top: 51%; animation: patrol 5s ease-in-out infinite alternate-reverse; left: 30%; }
  .e3 { top: 46%; animation: patrol 9s linear infinite alternate; left: 70%; }
  @keyframes patrol { from { transform: translateX(-120px); } to { transform: translateX(160px); } }
  .crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); }
  .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
  .crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  .crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; }
  .clock { position: absolute; top: var(--space-8); left: 50%; transform: translateX(-50%);
    color: var(--color-text-muted); font-size: var(--text-xs); letter-spacing: 0.08em; }
  .clock b { color: var(--color-danger); }

  /* in-game HUD readout of hands (Hotwheel stand-in) */
  .hud-hands { position: absolute; left: var(--space-8); bottom: var(--space-8); display: flex; gap: var(--space-4);
    font-size: var(--text-xs); color: var(--color-text-muted); transition: opacity 0.15s ease; }
  .hud-hands div { background: rgba(0,0,0,0.45); border: 1px solid var(--color-border); padding: 4px 8px; border-radius: var(--radius-sm); }
  .hud-hands b { color: var(--color-text); font-weight: 600; }

  /* ---------- inventory panel (shared pieces) ---------- */
  .inv { position: absolute; background: var(--color-surface); border: 1px solid var(--color-border);
    box-shadow: var(--shadow-lg); display: flex; gap: var(--space-6); padding: var(--space-6);
    transition: transform 0.16s ease, opacity 0.16s ease; }
  .inv.closed { opacity: 0; pointer-events: none; }
  .inv-head { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--text-xs);
    color: var(--color-text-muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .inv-head b { color: var(--color-text); }

  .grid { display: grid; gap: var(--space-2); grid-template-columns: repeat(var(--cols, 4), var(--slot)); }
  .slot { width: var(--slot); height: var(--slot); background: var(--color-slot); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); position: relative; transition: all 0.1s ease; }
  .slot:hover { background: var(--color-slot-hover); border-color: var(--color-border-strong); }
  .slot.over { border-color: var(--color-primary); background: var(--color-primary-dim); }
  .slot .idx { position: absolute; top: 2px; left: 4px; font-size: 9px; color: var(--color-text-muted); opacity: 0.6; }

  .tile { position: absolute; inset: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: grab; user-select: none; border-radius: var(--radius-sm); }
  .tile:active { cursor: grabbing; }
  .tile .glyph { font-size: 22px; line-height: 1; }
  .tile .name { font-size: 9px; color: var(--color-text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; max-width: 100%; text-overflow: ellipsis; }
  .tile .count { position: absolute; right: 2px; bottom: 1px; font-size: var(--text-xs); font-weight: 700; color: var(--color-text); }
  .tile .tag { position: absolute; left: 2px; bottom: 1px; font-size: 8px; padding: 0 3px; border-radius: 2px;
    background: var(--color-accent); color: var(--color-bg); font-weight: 700; }
  .tile.dragging { opacity: 0.35; }

  /* hand drop targets */
  .hand { position: relative; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md);
    background: var(--color-slot); display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: all 0.1s ease; min-width: 76px; min-height: 76px; }
  .hand:hover { border-color: var(--color-text-muted); }
  .hand.over { border-style: solid; border-color: var(--color-primary); background: var(--color-primary-dim); }
  .hand.default { border-color: var(--color-primary); }
  .hand .label { position: absolute; top: 3px; left: 6px; font-size: 9px; letter-spacing: 0.1em; color: var(--color-text-muted); }
  .hand.default .label { color: var(--color-primary); }
  .hand .empty { color: var(--color-text-muted); font-size: var(--text-xs); }
  .hand .tile { position: static; inset: auto; padding: 14px 6px 4px; }
  .hand.support { border-style: solid; border-color: var(--color-accent); background: rgba(111,179,168,0.08); }
  .hand .support-note { font-size: 9px; color: var(--color-accent); text-align: center; line-height: 1.3; padding-top: 10px; }
  .hand .steady { font-size: 9px; color: var(--color-accent); margin-top: 2px; }

  .figure svg { display: block; }
  .figure line, .figure circle { stroke: var(--color-text-muted); stroke-width: 3; fill: none; stroke-linecap: round; }

  .detail { font-size: var(--text-xs); color: var(--color-text-muted); min-height: 30px; line-height: 1.4; }
  .detail b { color: var(--color-text); }

  /* ---------- Variant A: right-edge column ---------- */
  .layout-a .inv { right: var(--space-8); top: var(--space-8); width: 300px; flex-direction: column; }
  .layout-a .inv.closed { transform: translateX(24px); }
  .layout-a .grid { --cols: 4; }
  .layout-a .doll { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-4);
    padding-top: var(--space-6); border-top: 1px solid var(--color-border); }
  .layout-a .doll .hand { height: 96px; }

  /* ---------- Variant B: bottom strip (extends the hotwheel) ---------- */
  .layout-b .inv { left: 50%; bottom: var(--space-8); transform: translateX(-50%); flex-direction: column; gap: var(--space-4); }
  .layout-b .inv.closed { transform: translate(-50%, 24px); }
  .layout-b .strip { display: flex; align-items: stretch; gap: var(--space-6); }
  .layout-b .grid { --cols: 8; }
  .layout-b .hand { width: 84px; }
  .layout-b .figure { display: none; }
  .layout-b .doll { display: contents; }
  .layout-b .hud-hands { opacity: 0; }

  /* ---------- Variant C: split, framing the crosshair ---------- */
  .layout-c .inv.left { left: var(--space-8); top: 50%; transform: translateY(-50%); flex-direction: column; }
  .layout-c .inv.left.closed { transform: translate(-24px, -50%); }
  .layout-c .inv.right { right: var(--space-8); top: 50%; transform: translateY(-50%); flex-direction: column; align-items: center; }
  .layout-c .inv.right.closed { transform: translate(24px, -50%); }
  .layout-c .grid { --cols: 2; }
  .layout-c .doll { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
  .layout-c .doll .hands-row { display: flex; gap: var(--space-4); }
  .layout-c .hand { width: 84px; height: 84px; }

  /* ---------- toast ---------- */
  #toast { position: fixed; left: 50%; top: 56px; transform: translate(-50%, -8px); opacity: 0; z-index: 9997;
    background: var(--color-surface-2); border: 1px solid var(--color-border-strong); padding: 6px 12px;
    font-size: var(--text-xs); border-radius: var(--radius-md); transition: all 0.15s ease; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { border-color: var(--color-danger); color: var(--color-danger); }

  /* ---------- sketch toolbar ---------- */
  #sketch-tools { position: fixed; top: 48px; left: 12px; z-index: 9999; font-family: system-ui; font-size: 12px;
    background: rgba(0,0,0,0.75); color: white; padding: 8px 12px; border-radius: 8px; opacity: 0.4; transition: opacity 0.2s;
    display: flex; gap: 8px; align-items: center; }
  #sketch-tools:hover { opacity: 1; }
  #sketch-tools select, #sketch-tools button { font: inherit; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  #sketch-tools button:hover { background: #333; }
</style>
</head>
<body>

<div id="variant-nav">
  <button class="variant-tab active" data-v="a">A: Right-edge column</button>
  <button class="variant-tab" data-v="b">B: Bottom strip (hotwheel+)</button>
  <button class="variant-tab" data-v="c">C: Split around crosshair</button>
  <span class="hint"><kbd>Tab</kbd> / <kbd>I</kbd> toggle · drag to a hand · double-click = default hand · shift+double-click = other hand · right-click = unequip · <span style="color:var(--color-primary)">●</span> = defaultHand</span>
</div>

<div id="game" class="layout-a">
  <div class="horizon-grid"></div>
  <div class="enemy e1" style="left:40%"></div>
  <div class="enemy e2"></div>
  <div class="enemy e3"></div>
  <div class="crosshair"></div>
  <div class="clock">LIVE · <b id="clock">00:00.0</b> · world keeps running while open</div>
  <div class="hud-hands"><div>L <b id="hud-l">—</b></div><div>R <b id="hud-r">—</b></div></div>
  <div id="panels"></div>
</div>

<div id="toast"></div>

<div id="sketch-tools">
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
    <option value="default">Default</option>
  </select>
  <button id="btn-reset">Reset items</button>
  <button id="btn-state">State: normal</button>
  <select id="dflt-hand"><option value="right">defaultHand: Right</option><option value="left">defaultHand: Left</option></select>
</div>

<script>
// ---------- data: mirrors Inventory.Slot (item + stack), Item.equipInfo (label, twoHanded, supportHand) ----------
const CATALOG = {
  pistol:   { name: 'Pistol',        glyph: '╤', twoHanded: false, supportHand: true,  stackMax: 1 },
  smg:      { name: 'SMG',           glyph: '╦', twoHanded: false, supportHand: true,  stackMax: 1 },
  cannon:   { name: 'Double Cannon', glyph: '═', twoHanded: true,  supportHand: false, stackMax: 1 },
  lance:    { name: 'Cyber Lance',   glyph: '╪', twoHanded: true,  supportHand: false, stackMax: 1 },
  wrench:   { name: 'Wrench',        glyph: '⚒', twoHanded: false, supportHand: false, stackMax: 1 },
  fruit:    { name: 'Fruit',         glyph: '●', twoHanded: false, supportHand: false, stackMax: 8 },
  cells:    { name: 'Power Cells',   glyph: '▮', twoHanded: false, supportHand: false, stackMax: 24 },
};
const SLOT_COUNT = 8; // Inventory.slots default

function initialState(kind) {
  const s = { slots: Array(SLOT_COUNT).fill(null), hands: { left: null, right: null }, defaultHand: document.getElementById('dflt-hand').value };
  if (kind === 'empty') return s;
  const fill = kind === 'full'
    ? ['pistol','smg','cannon','lance','wrench',['fruit',5],['cells',24],['cells',9]]
    : ['smg','cannon',null,['fruit',3],'wrench',['cells',18],null,'lance'];
  fill.forEach((f, i) => { if (f) s.slots[i] = Array.isArray(f) ? { id: f[0], stack: f[1] } : { id: f, stack: 1 }; });
  if (kind !== 'full') s.hands.right = { id: 'pistol', stack: 1 };
  return s;
}
let state = initialState('normal');
let variant = 'a';
let open = true;

const other = h => (h === 'left' ? 'right' : 'left');
const twoHandedHeld = () => ['left','right'].map(h => state.hands[h]).find(it => it && CATALOG[it.id].twoHanded);

// ---------- rules ----------
function firstEmptySlot(except = -1) { return state.slots.findIndex((s, i) => s === null && i !== except); }

function stow(item, preferSlot = -1) {
  if (!item) return true;
  // merge into an existing stack first
  const def = CATALOG[item.id];
  if (def.stackMax > 1) {
    const j = state.slots.findIndex(s => s && s.id === item.id && s.stack < def.stackMax);
    if (j >= 0) { const room = def.stackMax - state.slots[j].stack; const n = Math.min(room, item.stack); state.slots[j].stack += n; item.stack -= n; if (item.stack === 0) return true; }
  }
  const j = preferSlot >= 0 && state.slots[preferSlot] === null ? preferSlot : firstEmptySlot();
  if (j < 0) return false;
  state.slots[j] = item; return true;
}

function takeFrom(src) {
  if (src.type === 'slot') { const it = state.slots[src.index]; state.slots[src.index] = null; return it; }
  const it = state.hands[src.hand]; state.hands[src.hand] = null; return it;
}

function equip(src, targetHand) {
  const snapshot = JSON.stringify(state);
  const item = takeFrom(src);
  if (!item) return;
  const def = CATALOG[item.id];
  if (def.stackMax > 1) { restore(snapshot); return toast(`${def.name} can't be held`, true); }
  let hand = targetHand;
  const displaced = [];
  if (def.twoHanded) {
    hand = state.defaultHand; // hand1 always goes to defaultHand
    ['left','right'].forEach(h => { if (state.hands[h]) { displaced.push(state.hands[h]); state.hands[h] = null; } });
  } else {
    const th = twoHandedHeld();
    if (th) { displaced.push(th); state.hands.left = state.hands.right = null; }
    else if (state.hands[hand]) { displaced.push(state.hands[hand]); state.hands[hand] = null; }
  }
  state.hands[hand] = item;
  // displaced items: swap back into the source slot / hand when possible
  for (const d of displaced) {
    if (src.type === 'hand' && !CATALOG[d.id].twoHanded && !def.twoHanded && state.hands[src.hand] === null) { state.hands[src.hand] = d; continue; }
    if (!stow(d, src.type === 'slot' ? src.index : -1)) { restore(snapshot); return toast(`No room to unequip ${CATALOG[d.id].name}`, true); }
  }
  toast(def.twoHanded ? `${def.name} → both hands (${hand} leads)` : `${def.name} → ${hand} hand`);
  render();
}

function moveToSlot(src, j) {
  if (src.type === 'slot') {
    if (src.index === j) return;
    const a = state.slots[src.index], b = state.slots[j];
    if (b && a && a.id === b.id && CATALOG[a.id].stackMax > 1) {
      const max = CATALOG[a.id].stackMax; const n = Math.min(max - b.stack, a.stack);
      b.stack += n; a.stack -= n; if (a.stack === 0) state.slots[src.index] = null;
    } else { state.slots[src.index] = b; state.slots[j] = a; }
    return render();
  }
  // from hand into slot
  const item = state.hands[src.hand];
  const target = state.slots[j];
  if (target && CATALOG[target.id].stackMax === 1) { equip({ type: 'slot', index: j }, src.hand); return; } // swap-equip
  state.hands[src.hand] = null;
  if (target) { state.hands[src.hand] = item; return toast('Slot occupied by a stack', true); }
  state.slots[j] = item; toast(`${CATALOG[item.id].name} stowed`); render();
}

function unequip(hand) {
  const it = state.hands[hand];
  if (!it) return;
  if (!stow(it)) return toast('Inventory full', true);
  state.hands[hand] = null; toast(`${CATALOG[it.id].name} stowed`); render();
}

function restore(snap) { state = JSON.parse(snap); render(); }

// ---------- rendering ----------
function tileHTML(item, src) {
  const d = CATALOG[item.id];
  return `<div class="tile" draggable="true" data-src='${JSON.stringify(src)}' title="${d.name}">
    <span class="glyph">${d.glyph}</span><span class="name">${d.name}</span>
    ${d.twoHanded ? '<span class="tag">2H</span>' : ''}
    ${d.stackMax > 1 ? `<span class="count">${item.stack}</span>` : ''}
  </div>`;
}

function gridHTML() {
  return `<div class="grid">${state.slots.map((s, i) =>
    `<div class="slot" data-slot="${i}"><span class="idx">${i + 1}</span>${s ? tileHTML(s, { type: 'slot', index: i }) : ''}</div>`).join('')}</div>`;
}

function handHTML(h) {
  const it = state.hands[h];
  const th = twoHandedHeld();
  const isDefault = state.defaultHand === h;
  let body, cls = '';
  if (it) body = tileHTML(it, { type: 'hand', hand: h });
  else if (th) { cls = ' support'; body = `<div class="support-note">supporting<br>${CATALOG[th.id].name}</div>`; }
  else {
    const o = state.hands[other(h)];
    body = `<span class="empty">empty</span>` + (o && CATALOG[o.id].supportHand ? `<span class="steady">steadies ${CATALOG[o.id].name}</span>` : '');
  }
  return `<div class="hand${isDefault ? ' default' : ''}${cls}" data-hand="${h}">
    <span class="label">${h === 'left' ? 'L' : 'R'} HAND${isDefault ? ' ●' : ''}</span>${body}</div>`;
}

const FIGURE = `<div class="figure"><svg width="60" height="96" viewBox="0 0 60 96">
  <circle cx="30" cy="14" r="9"/><line x1="30" y1="23" x2="30" y2="60"/>
  <line x1="30" y1="32" x2="8" y2="50"/><line x1="30" y1="32" x2="52" y2="50"/>
  <line x1="30" y1="60" x2="16" y2="92"/><line x1="30" y1="60" x2="44" y2="92"/></svg></div>`;

function headHTML() {
  const used = state.slots.filter(Boolean).length;
  return `<div class="inv-head"><span>Inventory</span><span><b>${used}</b>/${SLOT_COUNT}</span></div>`;
}

function render() {
  const game = document.getElementById('game');
  game.className = 'layout-' + variant;
  const c = open ? '' : ' closed';
  const detail = `<div class="detail" id="detail">Hover an item for details.</div>`;
  let html;
  if (variant === 'a') {
    html = `<div class="inv${c}">${headHTML()}${gridHTML()}${detail}
      <div class="doll">${handHTML('left')}${FIGURE}${handHTML('right')}</div></div>`;
  } else if (variant === 'b') {
    html = `<div class="inv${c}">${headHTML()}
      <div class="strip"><div class="doll">${handHTML('left')}</div>${gridHTML()}<div class="doll">${handHTML('right')}</div></div></div>`;
  } else {
    html = `<div class="inv left${c}">${headHTML()}${gridHTML()}${detail}</div>
      <div class="inv right${c}"><div class="inv-head"><span>Hands</span></div>
      <div class="doll">${FIGURE}<div class="hands-row">${handHTML('left')}${handHTML('right')}</div></div></div>`;
  }
  document.getElementById('panels').innerHTML = html;
  const nm = h => state.hands[h] ? CATALOG[state.hands[h].id].name : (twoHandedHeld() ? '(support)' : '—');
  document.getElementById('hud-l').textContent = nm('left');
  document.getElementById('hud-r').textContent = nm('right');
  wire();
}

// ---------- interaction ----------
let dragSrc = null;
function wire() {
  document.querySelectorAll('.tile').forEach(t => {
    const src = JSON.parse(t.dataset.src);
    t.addEventListener('dragstart', e => { dragSrc = src; t.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); });
    t.addEventListener('dragend', () => { dragSrc = null; t.classList.remove('dragging'); });
    t.addEventListener('mouseenter', () => {
      const it = src.type === 'slot' ? state.slots[src.index] : state.hands[src.hand];
      const d = CATALOG[it.id]; const el = document.getElementById('detail'); if (!el) return;
      el.innerHTML = `<b>${d.name}</b> · ${d.twoHanded ? 'two-handed (both hands, default leads)' : d.stackMax > 1 ? `stack ${it.stack}/${d.stackMax}, not holdable` : 'one-handed'}${d.supportHand ? ' · empty off-hand steadies it' : ''}`;
    });
    t.addEventListener('dblclick', e => {
      if (src.type === 'hand') return unequip(src.hand);
      equip(src, e.shiftKey ? other(state.defaultHand) : state.defaultHand);
    });
    t.addEventListener('contextmenu', e => { e.preventDefault(); if (src.type === 'hand') unequip(src.hand); });
  });
  document.querySelectorAll('[data-slot], [data-hand]').forEach(z => {
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', e => {
      e.preventDefault(); z.classList.remove('over');
      if (!dragSrc) return;
      if (z.dataset.hand) equip(dragSrc, z.dataset.hand); else moveToSlot(dragSrc, +z.dataset.slot);
    });
  });
}

let toastTimer;
function toast(msg, bad = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 1400);
}

document.querySelectorAll('.variant-tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.variant-tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); variant = b.dataset.v; render();
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' || e.key.toLowerCase() === 'i') { e.preventDefault(); open = !open; render(); }
});
const STATES = ['normal', 'full', 'empty'];
let stateIdx = 0;
document.getElementById('btn-state').addEventListener('click', e => {
  stateIdx = (stateIdx + 1) % STATES.length; state = initialState(STATES[stateIdx]);
  e.target.textContent = 'State: ' + STATES[stateIdx]; render();
});
document.getElementById('btn-reset').addEventListener('click', () => { state = initialState(STATES[stateIdx]); render(); });
document.getElementById('dflt-hand').addEventListener('change', e => { state.defaultHand = e.target.value; render(); });

// live clock: the world never pauses
const t0 = performance.now();
setInterval(() => {
  const s = (performance.now() - t0) / 1000;
  document.getElementById('clock').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(1).padStart(4, '0')}`;
}, 100);

render();
</script>
</body>
</html>
